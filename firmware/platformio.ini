; PlatformIO configuration for Jarvis Edge Node firmware
; Board: Elecrow 3.5" ESP32-S3 HMI (ILI9488 + GT911 capacitive touch)
; See ../docs/sdd.txt section 2.1 for the hardware rationale.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 460800
upload_speed = 921600

; ── Board configuration ──────────────────────────────────────
; The Elecrow 3.5" HMI uses DIO flash — override the devkit default (QIO).
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; LVGL needs to find lv_conf.h — tell it to look in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; ── Libraries ────────────────────────────────────────────────
; PlatformIO downloads these automatically on first build.
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ ^9.2.0
