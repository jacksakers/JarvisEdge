server:
  host: 0.0.0.0
  port: 8010
  reload: false
database:
  path: jarvis_edge.db
ollama:
  host: http://localhost:11434
  fast_model: phi4-mini:latest
  heavy_model: gemma4:e4b
  request_timeout_seconds: 120
asr:
  model_size: base
  device: cpu
  compute_type: int8
mqtt:
  host: localhost
  port: 1883
  topic_feed: jarvis/ui/feed
# Tapo account login (same as the Tapo app) — used only for the local KLAP
# handshake with each bulb's own IP (see app/tapo.py). Leave blank to disable
# the Ambient Home card.
tapo:
  email: ""
  password: ""
# Raw WAVs are saved here after transcription so the Command Center's Voice
# Logs page can play them back (useful for diagnosing mic/capture issues).
# Set keep_files: false to delete audio immediately after transcription instead.
audio:
  path: audio_logs
  keep_files: true
# Optional integration with a full JARVIS 3.0 instance (../../JARVIS/3dot0).
# When enabled, voice transcripts are also delegated to the JARVIS agent loop
# (tools + memory), and "Note" actions are forwarded into its journal.
jarvis:
  enabled: false
  base_url: http://localhost:8000
  api_prefix: /api/v1
device:
  ambient_vad_mode: false
  power_saving_mode: false
  screen_off_timeout: 30
  screen_lock_enabled: false
